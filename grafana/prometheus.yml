global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aki-detection'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'aki-detection'
          namespace: 'sharq'
          group: 'sharq'

alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "prom-ui.coursework6:9093"